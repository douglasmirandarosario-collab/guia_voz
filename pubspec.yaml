publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Acessibilidade
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  # Câmera
